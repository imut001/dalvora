<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DALVORA Admin</title><style>body{font-family:system-ui;margin:0;background:#fff8ef;color:#241812}.wrap{max-width:1000px;margin:auto;padding:20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:white;border:1px solid #eaded3;border-radius:15px;padding:18px}.btn{background:#5b3928;color:white;border:0;border-radius:9px;padding:10px;font-weight:800}.form{display:grid;gap:8px}.form input{padding:11px;border:1px solid #eaded3;border-radius:8px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h1>DALVORA Admin</h1><p>Dashboard pengelolaan toko.</p><div id="stats" class="grid"></div><h2>Pesanan</h2><div id="orders"></div><h2>Tambah Produk</h2><div class="card form"><input id="pn" placeholder="Nama produk"><input id="pp" type="number" placeholder="Harga"><input id="pe" placeholder="Emoji"><input id="pd" placeholder="Deskripsi"><button class="btn" onclick="addProduct()">Tambah</button></div></div><script>let t=localStorage.dv_token||'';async function api(u,o={}){o.headers={...(o.headers||{}),Authorization:'Bearer '+t,'Content-Type':'application/json'};let r=await fetch(u,o);if(r.status===401||r.status===403){alert('Login admin terlebih dahulu.');location.href='/';return null}return r.json()}async function load(){let s=await api('/api/admin/stats'),o=await api('/api/admin/orders');if(!s)return;stats.innerHTML=`<div class="card"><b>Omzet dibayar</b><h2>Rp${s.revenue.toLocaleString('id-ID')}</h2></div><div class="card"><b>Total pesanan</b><h2>${s.orders}</h2></div><div class="card"><b>Pelanggan</b><h2>${s.customers}</h2></div>`;orders.innerHTML=o.map(x=>`<div class="card"><b>${x.order_no}</b> — ${x.customer_name}<br>Rp${x.total.toLocaleString('id-ID')}<br>Status: ${x.order_status} / ${x.payment_status}<br><button class="btn" onclick="status(${x.id},'processing')">Proses</button> <button class="btn" onclick="status(${x.id},'completed')">Selesai</button></div><br>`).join('')}async function status(id,s){await api('/api/admin/orders/'+id,{method:'PATCH',body:JSON.stringify({order_status:s})});load()}async function addProduct(){await api('/api/admin/products',{method:'POST',body:JSON.stringify({name:pn.value,price:Number(pp.value),emoji:pe.value||'🥤',description:pd.value})});load()}load()</script></body></html>
