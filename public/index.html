<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#8b5e3c">
  <title>DALVORA — More Than Just a Drink</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #faf7f2;
      color: #34251e;
    }

    header {
      background: #fff;
      padding: 18px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
    }

    .logo {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 3px;
      color: #70452d;
    }

    .tagline {
      font-size: 12px;
      margin-top: 4px;
      color: #9a745b;
    }

    .hero {
      padding: 35px 20px;
      text-align: center;
      background: linear-gradient(135deg,#f4e4d5,#fff8f0);
    }

    .hero h1 {
      font-size: 30px;
      margin-bottom: 10px;
    }

    .hero p {
      color: #765d50;
      line-height: 1.6;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 20px;
    }

    h2 {
      margin: 20px 0 15px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(2,1fr);
      gap: 14px;
    }

    .product {
      background: white;
      border-radius: 18px;
      padding: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,.07);
    }

    .drink {
      height: 130px;
      border-radius: 14px;
      background: linear-gradient(145deg,#ead1bd,#f9eee5);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      margin-bottom: 12px;
    }

    .product h3 {
      font-size: 16px;
      margin-bottom: 7px;
    }

    .price {
      font-weight: bold;
      color: #8b5e3c;
      margin-bottom: 10px;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 11px 14px;
      cursor: pointer;
      font-weight: bold;
    }

    .add {
      width: 100%;
      background: #8b5e3c;
      color: white;
    }

    .cart {
      margin-top: 25px;
      background: white;
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 3px 12px rgba(0,0,0,.07);
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }

    .checkout {
      margin-top: 15px;
      width: 100%;
      background: #34251e;
      color: white;
      font-size: 16px;
    }

    .empty {
      color: #888;
      text-align: center;
      padding: 10px;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.55);
      z-index: 20;
      padding: 20px;
      overflow-y: auto;
    }

    .modal-box {
      background: white;
      max-width: 500px;
      margin: 40px auto;
      border-radius: 20px;
      padding: 22px;
    }

    input, textarea, select {
      width: 100%;
      padding: 13px;
      margin: 7px 0 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
    }

    .submit {
      width: 100%;
      background: #8b5e3c;
      color: white;
      margin-top: 5px;
    }

    .close {
      background: #eee;
      margin-top: 8px;
      width: 100%;
    }

    footer {
      text-align: center;
      padding: 30px 15px;
      color: #806f64;
      font-size: 13px;
    }

    @media(max-width:500px) {
      .products {
        grid-template-columns: 1fr 1fr;
      }

      .drink {
        height: 110px;
      }

      .hero h1 {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">DALVORA</div>
  <div class="tagline">More Than Just a Drink.</div>
</header>

<section class="hero">
  <h1>Temukan Minuman Favoritmu</h1>
  <p>
    Korean-inspired drinks dengan rasa yang dibuat untuk menemani setiap momen.
  </p>
</section>

<main class="container">

  <h2>Menu DALVORA</h2>

  <div class="products" id="products"></div>

  <section class="cart">
    <h2>🛒 Keranjang</h2>
    <div id="cart"></div>
    <div id="total"></div>

    <button class="checkout" onclick="openCheckout()">
      Checkout
    </button>
  </section>

</main>

<div class="modal" id="checkoutModal">
  <div class="modal-box">

    <h2>Checkout DALVORA</h2>

    <label>Nama</label>
    <input id="name" placeholder="Nama kamu">

    <label>No. WhatsApp</label>
    <input id="phone" placeholder="08xxxxxxxxxx">

    <label>Alamat</label>
    <textarea id="address" rows="3"
      placeholder="Alamat lengkap pengantaran"></textarea>

    <label>Pembayaran</label>
    <select id="payment">
      <option value="COD">COD</option>
      <option value="TRANSFER">Transfer Bank</option>
      <option value="QRIS">QRIS</option>
    </select>

    <button class="submit" onclick="submitOrder()">
      Buat Pesanan
    </button>

    <button class="close" onclick="closeCheckout()">
      Batal
    </button>

  </div>
</div>

<footer>
  © 2026 DALVORA<br>
  More Than Just a Drink.
</footer>

<script>

const products = [
  {
    name: "Korean Lemonade",
    price: 20000,
    emoji: "🍋"
  },
  {
    name: "Citrus Honey Tea",
    price: 15000,
    emoji: "🍊"
  },
  {
    name: "Jasmine Green Tea",
    price: 10000,
    emoji: "🍵"
  },
  {
    name: "CoconutShake Vanilla",
    price: 10000,
    emoji: "🥥"
  },
  {
    name: "CoconutShake Coklat",
    price: 10000,
    emoji: "🍫"
  },
  {
    name: "CoconutShake Strawberry",
    price: 12000,
    emoji: "🍓"
  },
  {
    name: "CoconutShake Choco Chunk",
    price: 15000,
    emoji: "🍫"
  },
  {
    name: "CoconutShake Choco Fudge",
    price: 15000,
    emoji: "🍫"
  },
  {
    name: "CoconutShake White Coffee",
    price: 15000,
    emoji: "☕"
  }
];

let cart = [];

function rupiah(number) {
  return new Intl.NumberFormat("id-ID", {
    style: "currency",
    currency: "IDR",
    maximumFractionDigits: 0
  }).format(number);
}

function renderProducts() {

  const box = document.getElementById("products");

  box.innerHTML = products.map((p,index) => `
    <div class="product">

      <div class="drink">
        ${p.emoji}
      </div>

      <h3>${p.name}</h3>

      <div class="price">
        ${rupiah(p.price)}
      </div>

      <button class="add" onclick="addCart(${index})">
        + Tambah
      </button>

    </div>
  `).join("");
}

function addCart(index) {

  cart.push(products[index]);

  renderCart();

}

function removeCart(index) {

  cart.splice(index,1);

  renderCart();

}

function renderCart() {

  const box = document.getElementById("cart");
  const totalBox = document.getElementById("total");

  if(cart.length === 0) {

    box.innerHTML =
      `<div class="empty">Keranjang masih kosong.</div>`;

    totalBox.innerHTML = "";

    return;
  }

  box.innerHTML = cart.map((item,index) => `
    <div class="cart-item">

      <span>
        ${item.name}<br>
        <small>${rupiah(item.price)}</small>
      </span>

      <button onclick="removeCart(${index})">
        ❌
      </button>

    </div>
  `).join("");

  const total =
    cart.reduce((sum,item) => sum + item.price,0);

  totalBox.innerHTML = `
    <h3 style="margin-top:15px">
      Total: ${rupiah(total)}
    </h3>
  `;
}

function openCheckout() {

  if(cart.length === 0) {

    alert("Keranjang masih kosong.");

    return;
  }

  document.getElementById("checkoutModal")
    .style.display = "block";
}

function closeCheckout() {

  document.getElementById("checkoutModal")
    .style.display = "none";
}

function submitOrder() {

  const name =
    document.getElementById("name").value.trim();

  const phone =
    document.getElementById("phone").value.trim();

  const address =
    document.getElementById("address").value.trim();

  const payment =
    document.getElementById("payment").value;

  if(!name || !phone || !address) {

    alert("Mohon lengkapi nama, WhatsApp, dan alamat.");

    return;
  }

  const total =
    cart.reduce((sum,item) => sum + item.price,0);

  const orderNumber =
    "DAL" + Date.now().toString().slice(-7);

  const items =
    cart.map(item => item.name).join(", ");

  const message =
`Halo DALVORA 👋

Saya ingin membuat pesanan.

No Pesanan: ${orderNumber}

Nama: ${name}
WhatsApp: ${phone}

Pesanan:
${items}

Total: ${rupiah(total)}

Pembayaran: ${payment}

Alamat:
${address}`;

  /*
    GANTI NOMOR DI BAWAH DENGAN NOMOR WHATSAPP DALVORA
    Contoh Indonesia:
    6281234567890
  */

  const whatsappNumber = "6281234567890";

  const url =
    "https://wa.me/" +
    whatsappNumber +
    "?text=" +
    encodeURIComponent(message);

  window.open(url,"_blank");

  cart = [];

  renderCart();

  closeCheckout();

  alert(
    "Pesanan dibuat dengan nomor " +
    orderNumber
  );
}

renderProducts();
renderCart();

</script>

</body>
</html>
