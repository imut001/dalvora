<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#5b3928"><link rel="manifest" href="/manifest.json"><title>DALVORA</title>
<style>
body{margin:0;background:#fff8ef;color:#241812;font-family:system-ui,sans-serif}.wrap{max-width:900px;margin:auto;padding:18px}.nav{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;letter-spacing:3px;color:#5b3928}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:800;background:#5b3928;color:white}.hero{padding:35px 0}.hero h1{font-size:clamp(42px,8vw,72px);line-height:.95}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{background:white;border:1px solid #eaded3;border-radius:18px;padding:15px}.emoji{font-size:50px;background:#f8dfcc;border-radius:15px;padding:25px;text-align:center}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.price{font-weight:900}.muted{color:#7d6a5e}.box{background:white;border:1px solid #eaded3;border-radius:18px;padding:18px;margin:15px 0}.modal{display:none;position:fixed;inset:0;background:#0008;align-items:end}.modal.on{display:flex}.sheet{background:#fff8ef;width:100%;max-width:650px;margin:auto;padding:20px;border-radius:22px 22px 0 0}.form{display:grid;gap:9px}.form input,.form textarea,.form select{padding:12px;border:1px solid #eaded3;border-radius:10px}.item{padding:10px 0;border-bottom:1px solid #eaded3;display:flex;justify-content:space-between}@media(max-width:600px){.grid{grid-template-columns:1fr}}
</style></head>
<body><div class="wrap">
<div class="nav"><div class="brand">DALVORA<br><small>MORE THAN JUST A DRINK</small></div><div><button class="btn" onclick="login()">Login</button> <button class="btn" onclick="cart()">🛒 <span id="n">0</span></button></div></div>
<section class="hero"><div class="muted">KOREAN DRINK • FRESH BEVERAGE</div><h1>Lebih dari sekadar minuman.</h1><p class="muted">Pesan langsung melalui DALVORA.</p></section>
<h2>Menu</h2><div class="grid" id="products"></div>
<div class="box"><b>📱 Pesan langsung di DALVORA</b><p class="muted">Login → pilih menu → checkout → bayar. Untuk produksi, sambungkan payment gateway QRIS.</p></div>
</div>
<div class="modal" id="m"><div class="sheet"><div class="row"><h2 id="title">Login</h2><button onclick="closeM()">✕</button></div><div id="content"></div></div></div>
<script>
let token=localStorage.dv_token||'', user=JSON.parse(localStorage.dv_user||'null'), cartData=JSON.parse(localStorage.dv_cart||'{}'), products=[];
const rp=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(n);
async function load(){products=await (await fetch('/api/products')).json();document.querySelector('#products').innerHTML=products.map(p=>`<div class="card"><div class="emoji">${p.emoji}</div><h3>${p.name}</h3><p class="muted">${p.description}</p><div class="row"><b class="price">${rp(p.price)}</b><button class="btn" onclick="add(${p.id})">+ Tambah</button></div></div>`).join('');update()}
function add(id){cartData[id]=(cartData[id]||0)+1;save()}
function save(){localStorage.dv_cart=JSON.stringify(cartData);update()}
function update(){document.querySelector('#n').textContent=Object.values(cartData).reduce((a,b)=>a+b,0)}
function modal(t,h){document.querySelector('#title').textContent=t;document.querySelector('#content').innerHTML=h;document.querySelector('#m').classList.add('on')}
function closeM(){document.querySelector('#m').classList.remove('on')}
function login(){modal('Akun',`<div class="form"><input id="email" placeholder="Email"><input id="pass" type="password" placeholder="Password"><button class="btn" onclick="doLogin()">Login</button><button class="btn" onclick="register()">Daftar akun</button></div>`)}
async function doLogin(){let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:pass.value})});let d=await r.json();if(!r.ok)return alert(d.error);token=d.token;user=d.user;localStorage.dv_token=token;localStorage.dv_user=JSON.stringify(user);closeM();alert('Login berhasil')}
function register(){modal('Daftar',`<div class="form"><input id="rname" placeholder="Nama"><input id="remail" placeholder="Email"><input id="rpass" type="password" placeholder="Password minimal 6 karakter"><button class="btn" onclick="doReg()">Buat akun</button></div>`)}
async function doReg(){let r=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:rname.value,email:remail.value,password:rpass.value})});let d=await r.json();if(!r.ok)return alert(d.error);token=d.token;user=d.user;localStorage.dv_token=token;localStorage.dv_user=JSON.stringify(user);closeM();alert('Akun dibuat')}
function cart(){let ids=Object.keys(cartData).filter(k=>cartData[k]);let total=0;let html=ids.length?ids.map(k=>{let p=products.find(x=>x.id==k),q=cartData[k];total+=p.price*q;return `<div class="item"><span>${p.name} × ${q}</span><b>${rp(p.price*q)}</b></div>`}).join(''):'<p class="muted">Keranjang kosong.</p>';modal('Keranjang',html+`<h3>Total ${rp(total)}</h3>${ids.length?`<button class="btn" style="width:100%" onclick="checkout()">Checkout</button>`:''}`)}
function checkout(){if(!token){login();return}modal('Checkout',`<div class="form"><input id="cn" placeholder="Nama"><input id="cp" placeholder="WhatsApp"><textarea id="ca" placeholder="Alamat"></textarea><select id="pm"><option>QRIS</option><option>Transfer Bank</option><option>COD</option></select><button class="btn" onclick="order()">Buat Pesanan</button></div>`)}
async function order(){let items=Object.keys(cartData).filter(k=>cartData[k]).map(k=>({product_id:Number(k),qty:cartData[k]}));let r=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({name:cn.value,phone:cp.value,address:ca.value,payment_method:pm.value,items})});let d=await r.json();if(!r.ok)return alert(d.error);cartData={};save();modal('Pesanan dibuat',`<h3>${d.order_no}</h3><p>Total ${rp(d.total)}</p><p class="muted">Status pembayaran: menunggu. Hubungkan payment gateway untuk QRIS otomatis.</p><button class="btn" onclick="closeM()">Selesai</button>`)}
load();
</script></body></html>
